plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yunobi.airdropfarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.yunobi.airdropfarm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debug build bisa langsung di-install
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
