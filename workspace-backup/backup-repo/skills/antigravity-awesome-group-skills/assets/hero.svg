<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient glow spots -->
  <ellipse cx="600" cy="200" rx="350" ry="200" fill="#f59e0b" opacity="0.04" filter="url(#blur1)"/>
  <ellipse cx="200" cy="350" rx="200" ry="150" fill="#3b82f6" opacity="0.03" filter="url(#blur1)"/>
  <ellipse cx="1000" cy="100" rx="200" ry="150" fill="#8b5cf6" opacity="0.03" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5" fill="none">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Neural network lines from brain to cards -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.15">
    <line x1="600" y1="200" x2="180" y2="120"/>
    <line x1="600" y1="200" x2="180" y2="280"/>
    <line x1="600" y1="200" x2="380" y2="80"/>
    <line x1="600" y1="200" x2="380" y2="320"/>
    <line x1="600" y1="200" x2="820" y2="80"/>
    <line x1="600" y1="200" x2="820" y2="320"/>
    <line x1="600" y1="200" x2="1020" y2="120"/>
    <line x1="600" y1="200" x2="1020" y2="280"/>
  </g>

  <!-- Animated pulse rings around brain -->
  <circle cx="600" cy="200" r="65" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="200" r="85" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.1"/>
  <circle cx="600" cy="200" r="105" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.05"/>

  <!-- Central Brain Icon -->
  <g transform="translate(600,200)" filter="url(#soft-glow)">
    <!-- Brain outer shape -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    <!-- Neural pathways -->
    <path d="M-25,-15 Q0,-35 25,-15" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <path d="M-25,15 Q0,35 25,15" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <!-- Neural nodes -->
    <circle cx="-15" cy="-20" r="4" fill="#f59e0b" opacity="0.9"/>
    <circle cx="15" cy="-20" r="4" fill="#f59e0b" opacity="0.9"/>
    <circle cx="-15" cy="20" r="4" fill="#f59e0b" opacity="0.9"/>
    <circle cx="15" cy="20" r="4" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="-30" r="3" fill="#f59e0b" opacity="0.7"/>
    <circle cx="0" cy="30" r="3" fill="#f59e0b" opacity="0.7"/>
    <circle cx="-30" cy="0" r="3" fill="#f59e0b" opacity="0.7"/>
    <circle cx="30" cy="0" r="3" fill="#f59e0b" opacity="0.7"/>
    <!-- Core -->
    <circle cx="0" cy="0" r="8" fill="#f59e0b" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Left floating skill cards -->
  <!-- Card 1: React -->
  <g transform="translate(120,90)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <circle cx="50" cy="22" r="12" fill="none" stroke="#61dafb" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="50" cy="22" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.4" transform="rotate(0 50 22)"/>
    <ellipse cx="50" cy="22" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.4" transform="rotate(60 50 22)"/>
    <ellipse cx="50" cy="22" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.4" transform="rotate(-60 50 22)"/>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">React</text>
  </g>

  <!-- Card 2: Python -->
  <g transform="translate(120,250)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="50" y="28" text-anchor="middle" fill="#3776ab" font-family="monospace" font-size="18" font-weight="bold">Py</text>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">Python</text>
  </g>

  <!-- Left inner cards -->
  <!-- Card 3: Docker -->
  <g transform="translate(320,55)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <rect x="30" y="10" width="14" height="8" rx="1" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.7"/>
    <rect x="46" y="10" width="14" height="8" rx="1" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.7"/>
    <rect x="30" y="20" width="14" height="8" rx="1" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.7"/>
    <rect x="46" y="20" width="14" height="8" rx="1" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.7"/>
    <rect x="62" y="10" width="8" height="18" rx="1" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.5"/>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">Docker</text>
  </g>

  <!-- Card 4: Security -->
  <g transform="translate(320,290)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <path d="M50,10 L70,18 L70,28 Q70,38 50,42 Q30,38 30,28 L30,18 Z" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">Security</text>
  </g>

  <!-- Right floating skill cards -->
  <!-- Card 5: Database -->
  <g transform="translate(780,55)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <ellipse cx="50" cy="16" rx="20" ry="6" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
    <line x1="30" y1="16" x2="30" y2="28" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
    <line x1="70" y1="16" x2="70" y2="28" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
    <ellipse cx="50" cy="28" rx="20" ry="6" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">Database</text>
  </g>

  <!-- Card 6: CI/CD -->
  <g transform="translate(780,290)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <circle cx="38" cy="22" r="8" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.7"/>
    <circle cx="62" cy="22" r="8" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
    <path d="M46,22 L54,22" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">CI/CD</text>
  </g>

  <!-- Card 7: AI -->
  <g transform="translate(970,90)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="50" y="30" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="bold">AI</text>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">ML/AI</text>
  </g>

  <!-- Card 8: DevOps -->
  <g transform="translate(970,250)" filter="url(#blur2)">
    <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <circle cx="50" cy="20" r="12" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
    <text x="50" y="24" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">⚙</text>
    <text x="50" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">DevOps</text>
  </g>

  <!-- Connecting node dots -->
  <g fill="#f59e0b">
    <circle cx="350" cy="155" r="2" opacity="0.4"/>
    <circle cx="450" cy="120" r="2" opacity="0.4"/>
    <circle cx="550" cy="100" r="2" opacity="0.3"/>
    <circle cx="700" cy="120" r="2" opacity="0.4"/>
    <circle cx="850" cy="155" r="2" opacity="0.4"/>
    <circle cx="350" cy="245" r="2" opacity="0.4"/>
    <circle cx="450" cy="280" r="2" opacity="0.4"/>
    <circle cx="550" cy="300" r="2" opacity="0.3"/>
    <circle cx="700" cy="280" r="2" opacity="0.4"/>
    <circle cx="850" cy="245" r="2" opacity="0.4"/>
  </g>

  <!-- Text: 1,449+ -->
  <text x="600" y="150" text-anchor="middle" fill="#f59e0b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="800" opacity="0.12">1,449+</text>

  <!-- Bottom line accent -->
  <rect x="400" y="370" width="400" height="2" rx="1" fill="url(#glow)" opacity="0.5"/>
</svg>
